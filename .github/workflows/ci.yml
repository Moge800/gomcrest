name: CI

# Pushes to main and pull requests into main. A push to a PR branch is
# covered by its pull_request run, so branch pushes do not run CI twice.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # no dependencies, no go.sum

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Compiles integration_test.go. Its tests skip because GOMCR_TEST_URL is
      # unset: CI never talks to a PLC.
      - name: Integration tests (compile only)
        run: go test -tags integration ./...
